<!DOCTYPE html>
<html>

<head>
    <title>Customer Churn Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 30px;
        }

        h3 {
            color: #1e3c72;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #1e3c72;
        }

        .result {
            margin-top: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .churn {
            color: red;
        }

        .stay {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Customer Churn Prediction</h1>

    <form action="/predictdata" method="POST">

        <h3>Customer Information</h3>

        <div class="form-group">
            <label>Gender</label>
            <select name="Gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="form-grop">
            <label>City</label>
            <input type="text" name="City" placeholder="Enterr city name" required>
        </div>

        <div class="form-group">
            <label>Senior Citizen</label>
            <select name="Senior_Citizen" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Partner</label>
            <select name="Partner" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Dependents</label>
            <select name="Dependents" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <h3>Services</h3>

        <div class="form-group">
            <label>Phone Service</label>
            <select name="Phone_Service" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Multiple Lines</label>
            <select name="Multiple_Lines" required>
                <option value="No phone service">No phone service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Internet Service</label>
            <select name="Internet_Service" required>
                <option value="DSL">DSL</option>
                <option value="Fiber optic">Fiber optic</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Online Security</label>
            <select name="Online_Security" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Online Backup</label>
            <select name="Online_Backup" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Device Protection</label>
            <select name="Device_Protection" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tech Support</label>
            <select name="Tech_Support" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Streaming TV</label>
            <select name="Streaming_TV" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Streaming Movies</label>
            <select name="Streaming_Movies" required>
                <option value="No internet service">No internet service</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <h3>Billing & Contract</h3>

        <div class="form-group">
            <label>Paperless Billing</label>
            <select name="Paperless_Billing" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Contract</label>
            <select name="Contract" required>
                <option value="Month-to-month">Month-to-month</option>
                <option value="One year">One year</option>
                <option value="Two year">Two year</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Method</label>
            <select name="Payment_Method" required>
                <option value="Electronic check">Electronic check</option>
                <option value="Mailed check">Mailed check</option>
                <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                <option value="Credit card (automatic)">Credit card (automatic)</option>
            </select>
        </div>

        <h3>Account Information</h3>

        <div class="form-group">
            <label>Tenure Months</label>
            <input type="number" min="0" max="100" name="Tenure_Months" required>
        </div>

        <div class="form-group">
            <label>Monthly Charges ($)</label>
            <input type="number" step="0.01" name="Monthly_Charges" required>
        </div>

        <div class="form-group">
            <label>Total Charges ($)</label>
            <input type="number" step="0.01" name="Total_Charges" required>
        </div>

        <button type="submit">
            Predict Churn
        </button>

    </form>

    {% if results is defined %}

    <div class="result">

        {% if results == 1 %}
        <div class="churn">
            ❌ Customer is likely to churn
        </div>
        {% else %}
        <div class="stay">
            ✅ Customer is likely to stay
        </div>
        {% endif %}

    </div>

    {% endif %}

</div>

</body>
</html>
